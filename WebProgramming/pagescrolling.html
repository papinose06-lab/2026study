<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagescrolling</title>
    <style>
        body, html {margin:0; padding:0; overflow:hidden; height:100%;};
        .page-container {height:300vh; display:flex; flex-direction:column; transition:transform 0.6s ease-in-out};
        .page {width:100vw; height:100vh; display:flex; justify-content:center; align-items:center; color:white;};
        .page1 {background-color: #3498db};
        .page2 {background-color: #b83f3f};
        .page3 {background-color: #1e9f32};
    </style>
</head>
<body>
    <div class="page-container">
        <div class="page page1">page_1</div>
        <div class="page page2">page_2</div>
        <div class="page page3">page_3</div>
    </div>
    <script>
        let currentPage=0;
        const pages=document.querySelectorAll('.page');
        const pageContainer=document.querySelector('.page-container');
        const totalPages=pages.legth;
        window.addEventListener('wheel', (event) => {
            if (event.deltaY>0) {
                nextPage();
            } else {
                previousPage();
            }
        });
        function nextPage() {
            if (currentPage<totalPages-1) {
                currentPage++;
                scrollToPage();
            }
        }
        function previousPage() {
            if (currentPage>0) {
                currentPage--;
                scrollToPage();
            }
        }
        function scrollToPage() {
            const offset=currentPage*window.innerHeight;
            pageContainer.style.transform='translateY(-${offset}px)';
        }
    </script>
</body>
</html>
